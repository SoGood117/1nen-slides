<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>600形容詞・副詞／比較(1)解説</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #1e3a5f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .slide-container {
            width: 100%;
            max-width: 820px;
        }

        .slide-header {
            background-color: #152b47;
            color: #ffffff;
            padding: 16px 28px;
            border-radius: 14px 14px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .slide-counter {
            font-size: 1rem;
            opacity: 0.75;
        }

        .slide-card {
            background-color: #ffffff;
            padding: 52px 44px 44px;
            border-radius: 0 0 14px 14px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            gap: 36px;
        }

        .sentence-area {
            text-align: center;
        }

        .sentence {
            font-size: 1.75rem;
            font-weight: 500;
            color: #1a2f4e;
            line-height: 1.7;
        }

        .sentence em {
            font-style: normal;
            font-weight: 700;
            color: #c85500;
            border-bottom: 3px solid #f4900c;
        }

        .reveal-word {
            font-style: normal;
            font-weight: 700;
            color: #c85500;
            border-bottom: 3px solid #f4900c;
            cursor: pointer;
            border-radius: 3px;
            padding: 0 1px;
            transition: all 0.15s;
        }

        .reveal-word.masked {
            background-color: #d1d5db;
            color: transparent;
            border-bottom-color: transparent;
            border-radius: 4px;
        }

        .points-area {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .point-box {
            background-color: #fff8f0;
            border-left: 6px solid #f4900c;
            border-radius: 8px;
            padding: 16px 22px;
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.15s;
        }

        .point-box:hover {
            background-color: #fff0dc;
        }

        .point-expr {
            font-size: 1.05rem;
            font-weight: 700;
            color: #c85500;
            font-family: 'Courier New', monospace;
            min-width: 180px;
        }

        .point-arrow {
            color: #f4900c;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .point-meaning {
            font-size: 1.1rem;
            color: #1a2f4e;
            font-weight: 500;
            transition: all 0.2s;
        }

        .point-meaning.hidden {
            background-color: #d1d5db;
            color: transparent;
            border-radius: 6px;
            padding: 2px 8px;
            letter-spacing: -0.05em;
        }

        .point-hint {
            font-size: 0.8rem;
            color: #9ca3af;
            margin-left: auto;
        }

        .point-box.revealed .point-hint { display: none; }

        .nav-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin-top: 28px;
        }

        .nav-btn {
            background-color: #ffffff;
            color: #1e3a5f;
            border: none;
            border-radius: 50px;
            padding: 13px 36px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Noto Sans JP', sans-serif;
            transition: all 0.2s;
            user-select: none;
        }

        .nav-btn:hover:not(:disabled) {
            background-color: #f4900c;
            color: #ffffff;
            transform: scale(1.03);
        }

        .nav-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.35);
            cursor: pointer;
            transition: all 0.2s;
        }

        .dot.active {
            background-color: #f4900c;
            transform: scale(1.4);
        }

        @media (max-width: 600px) {
            .sentence { font-size: 1.25rem; }
            .point-expr { min-width: unset; font-size: 0.95rem; }
            .point-meaning { font-size: 0.95rem; }
            .slide-card { padding: 32px 20px; }
            .nav-btn { padding: 11px 24px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="slide-container">
    <div class="slide-header">
        <span class="section-title" id="sectionTitle"></span>
        <span class="slide-counter" id="slideCounter"></span>
    </div>
    <div class="slide-card">
        <div class="sentence-area">
            <p class="sentence" id="sentenceText"></p>
        </div>
        <div class="points-area" id="pointsArea"></div>
    </div>
</div>

<div class="nav-area">
    <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">◀ 前へ</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">次へ ▶</button>
</div>

<script>
const SLIDES = [
    { section:"形容詞・副詞 No.1", sentence:"There wasn't <em>enough</em> food for all of us.", translation:"私たち全員に足りるだけの食べ物はありませんでした。",
      points:[{expr:"enough",meaning:"十分な、足りるだけの"}] },
    { section:"形容詞・副詞 No.2", sentence:"<em>Every</em> member understands the <em>present</em> problem.", translation:"メンバー全員が現在の問題を把握しています。",
      points:[{expr:"every 〜",meaning:"どの〜も（単数扱い）"},{expr:"present",meaning:"現在の"}] },
    { section:"形容詞・副詞 No.3", sentence:"The little boy is <em>awake</em>, and his father is <em>fast asleep</em>.", translation:"男の子は目を覚ましていますが、父親はぐっすり眠っています。",
      points:[{expr:"awake",meaning:"目が覚めて（いる）"},{expr:"fast asleep",meaning:"ぐっすり眠って（＝ sound asleep）"}] },
    { section:"形容詞・副詞 No.4", sentence:"It was a <em>close</em> game and many supporters were <em>excited about</em> it.", translation:"それは接戦で、多くのサポーターは興奮していました。",
      points:[{expr:"close ［klóus］",meaning:"接戦の、互角の（接近した）"},{expr:"be excited about 〜",meaning:"〜に興奮している"}] },
    { section:"形容詞・副詞 No.5", sentence:"She returned home <em>safe and sound</em> <em>the day before yesterday</em>.", translation:"彼女はおととい無事に家に帰ってきました。",
      points:[{expr:"safe and sound",meaning:"無事に（＝ safely）"},{expr:"the day before yesterday",meaning:"おととい"}] },
    { type:'explain', section:"比較の基本", html:`<div style="display:flex;flex-direction:column;gap:11px;"><p style="text-align:center;font-size:1.0rem;font-weight:700;color:#1a2f4e;margin-bottom:0;">比較表現には3つの形があります</p><div style="background:#fff8f0;border-left:6px solid #f4900c;border-radius:8px;padding:10px 16px;"><div style="font-weight:700;color:#c85500;font-size:1.0rem;margin-bottom:2px;">① 原級 ― 同じくらい</div><div style="font-size:1.12rem;color:#1a2f4e;margin:2px 0;">as <span style='color:#c85500;font-weight:700;'>原級</span> as …</div><div style="font-size:0.9rem;color:#4b5563;">「…と <b>同じくらい</b> 〜」　否定 not as 〜 as … ＝「…ほど〜でない」</div><div style="font-size:0.9rem;color:#1a2f4e;margin-top:3px;">例 This book is just <b style='color:#c85500;'>as easy as</b> that one.<span style="color:#9ca3af;">（この本はあの本と同じくらい易しい　← No.1）</span></div><div style="font-size:0.82rem;color:#6b7280;margin-top:2px;">※ as と as の間は、形容詞・副詞を <b>そのままの形</b> で入れる</div></div><div style="background:#eef6ff;border-left:6px solid #3b82f6;border-radius:8px;padding:10px 16px;"><div style="font-weight:700;color:#1d4ed8;font-size:1.0rem;margin-bottom:2px;">② 比較級 ― 〜より</div><div style="font-size:1.12rem;color:#1a2f4e;margin:2px 0;">形容詞・副詞 <span style='color:#1d4ed8;font-weight:700;'>(-er / more 〜)</span> than …</div><div style="font-size:0.9rem;color:#4b5563;">「… <b>より</b> 〜」</div><div style="font-size:0.9rem;color:#1a2f4e;margin-top:3px;">例 Your apartment is much <b style='color:#1d4ed8;'>larger than</b> mine.<span style="color:#9ca3af;">（あなたのアパートは私のよりずっと広い　← No.5）</span></div><div style="font-size:0.82rem;color:#6b7280;margin-top:2px;">※ つくり方 短い語→<b>-er</b>（tall→taller）／長い語→<b>more</b>（famous→more famous）　強めるときは much / far＝「ずっと」</div></div><div style="background:#f0fdf4;border-left:6px solid #16a34a;border-radius:8px;padding:10px 16px;"><div style="font-weight:700;color:#15803d;font-size:1.0rem;margin-bottom:2px;">③ 最上級 ― いちばん〜</div><div style="font-size:1.12rem;color:#1a2f4e;margin:2px 0;">the 形容詞・副詞 <span style='color:#15803d;font-weight:700;'>(-est / most 〜)</span> in 場所 ／ of 数</div><div style="font-size:0.9rem;color:#4b5563;">「… の中で <b>いちばん</b> 〜」</div><div style="font-size:0.9rem;color:#1a2f4e;margin-top:3px;">例 Mt. Fuji is <b style='color:#15803d;'>the highest</b> mountain <b style='color:#15803d;'>in</b> Japan.<span style="color:#9ca3af;">（富士山は日本でいちばん高い山だ）</span></div><div style="font-size:0.82rem;color:#6b7280;margin-top:2px;">※ つくり方 短い語→<b>-est</b> ／長い語→<b>most</b>　範囲 <b>in</b>＋場所・集団（in my class）／ <b>of</b>＋数（of the three）</div></div></div>` },
    { section:"比較（1） No.1", sentence:"This book is just <em>as easy as</em> that one.", translation:"この本はあの本とちょうど同じくらい易しい。",
      points:[{expr:"as 原級 as 〜",meaning:"〜と同じくらい…"},{expr:"just",meaning:"ちょうど"}] },
    { section:"比較（1） No.2", sentence:"He is <em>not as rich as</em> you are.", translation:"彼はあなたほど金持ちではありません。",
      points:[{expr:"not as 原級 as 〜",meaning:"〜ほど…でない"}] },
    { section:"比較（1） No.3", sentence:"She has <em>as many books as</em> I do.", translation:"彼女は私と同じくらい多くの本を持っています。",
      points:[{expr:"as many 〜 as …",meaning:"…と同じくらい多くの〜"},{expr:"as many books as me（口語）",meaning:"I do の代わりに me も可"}] },
    { section:"比較（1） No.4", sentence:"You must run <em>as fast as you can</em>.", translation:"あなたはできるだけ速く走らなければなりません。",
      points:[{expr:"as … as one can",meaning:"できるだけ…（＝ as … as possible）"}] },
    { section:"比較（1） No.5", sentence:"Your apartment is <em>much larger than</em> mine.", translation:"あなたのアパートの部屋は私のよりずっと広い。",
      points:[{expr:"比較級 + than 〜",meaning:"〜より…（larger＝より広い）"},{expr:"much",meaning:"ずっと（比較級を強める）"}] },
    { type:'all' }
];

let current = 0;

function toRevealable(html) {
    return html.replace(/<em>(.*?)<\/em>/g,
        '<span class="reveal-word masked" onclick="this.classList.toggle(\'masked\')">$1</span>');
}

function revealAll() {
    document.querySelectorAll('.reveal-word.masked').forEach(el => el.classList.remove('masked'));
}

function render() {
    const s = SLIDES[current];

    document.getElementById('prevBtn').disabled = current === 0;
    document.getElementById('nextBtn').disabled = current === SLIDES.length - 1;
    document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));

    if (s.type === 'all') {
        document.getElementById('sectionTitle').textContent = '600 形容詞・副詞／比較(1) 全文一覧';
        document.getElementById('slideCounter').textContent = `${current + 1} / ${SLIDES.length}`;
        document.getElementById('sentenceText').innerHTML = `
            <div style="text-align:right; margin-bottom:4px;">
                <button onclick="revealAll()" style="background:#f4900c; color:#fff; border:none; border-radius:20px; padding:7px 20px; font-size:0.85rem; font-weight:700; cursor:pointer; font-family:inherit;">重要語句を一斉表示</button>
            </div>
        `;
        const allSentences = SLIDES.filter(s => s.sentence);
        document.getElementById('pointsArea').innerHTML = `
            <div style="display:flex; flex-direction:column; gap:0;">
                ${allSentences.map((sl, i) => `
                    <div style="display:flex; gap:12px; align-items:flex-start; padding:14px 0; border-bottom:1px solid #f0e8e0;">
                        <span style="font-size:0.9rem; font-weight:700; color:#f4900c; min-width:24px; flex-shrink:0; padding-top:2px;">${i + 1}.</span>
                        <div style="display:flex; flex-direction:column; gap:4px;">
                            <span style="font-size:1rem; color:#1a2f4e; line-height:1.65;">${toRevealable(sl.sentence)}</span>
                            <span style="font-size:0.88rem; color:#6b7280; line-height:1.5;">${sl.translation}</span>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
        return;
    }

    if (s.type === 'explain') {
        document.getElementById('sectionTitle').textContent = `600 ${s.section}`;
        document.getElementById('slideCounter').textContent = `${current + 1} / ${SLIDES.length}`;
        document.getElementById('sentenceText').innerHTML = '';
        document.getElementById('pointsArea').innerHTML = s.html;
        return;
    }

    document.getElementById('sectionTitle').textContent = `600 ${s.section}`;
    document.getElementById('slideCounter').textContent = `${current + 1} / ${SLIDES.length}`;
    document.getElementById('sentenceText').innerHTML = s.sentence;

    document.getElementById('pointsArea').innerHTML = s.points.map(p => `
        <div class="point-box" onclick="this.classList.toggle('revealed'); this.querySelector('.point-meaning').classList.toggle('hidden');">
            <span class="point-expr">${p.expr}</span>
            <span class="point-arrow">→</span>
            <span class="point-meaning hidden">「${p.meaning}」</span>
            <span class="point-hint">タップして表示</span>
        </div>
    `).join('');
}

function changeSlide(dir) {
    current = Math.max(0, Math.min(SLIDES.length - 1, current + dir));
    render();
}

// ドット生成
const dotsEl = document.getElementById('dots');
SLIDES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.onclick = () => { current = i; render(); };
    dotsEl.appendChild(d);
});

// キーボード操作
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  changeSlide(-1);
    if (e.key === 'ArrowRight') changeSlide(1);
});

render();
</script>
</body>
</html>
